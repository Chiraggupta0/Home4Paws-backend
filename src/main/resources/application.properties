spring.application.name=home4paws

# ===============================
# DATABASE
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:YOUR_LOCAL_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_LOCAL_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SERVER
# ===============================
server.port=${PORT:8081}

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:YOUR_LOCAL_JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# RAZORPAY
# ===============================
razorpay.key.id=${RAZORPAY_KEY_ID:YOUR_LOCAL_RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YOUR_LOCAL_RAZORPAY_SECRET}

# ===============================
# REDIS
# ===============================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ===============================
# LOGGING
# ===============================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.home4paws=${LOGGING_LEVEL_APP:INFO}